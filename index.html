<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Graficoo">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Graficoo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>

/* Layout: one phone-width app column (max 440px) — black brand bar on top, bottom tab bar with a red "+" price button in the middle, sheets slide up over it. */
:root {
  --bg: #F0F1F1; --surface: #FFFFFF; --surface-2: #F6F6F6; --ink: #141414; --muted: #6A6A6E; --line: #E2E2E3;
  --red: #EE2E24; --red-ink: #C61F16; --red-soft: #FDEAE8;
  --ok: #1D7F47; --ok-soft: #E3F2E9; --warn: #9A5B00; --warn-soft: #FFF0D6;
  --bar: #141414; --bar-ink: #FFFFFF; --bar-muted: #9A9A9E; --bar-2: #222222; --shade: rgba(20,20,20,.45);
  --frame: #DCDDDD;
  --paper: #FFFFFF; --paper-ink: #141414; --paper-gray: #CECECF; --paper-black: #1E1E1E; --paper-red: #EE2E24;
  --f-ui: "Montserrat", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "Montserrat", system-ui, sans-serif;
  --f-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --r-s: 10px; --r-m: 16px; --r-l: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #1A1A1A; --surface-2: #222222; --ink: #F1F1F1; --muted: #9D9DA1; --line: #2D2D2E;
  --red: #F0453B; --red-ink: #FF7A71; --red-soft: #3A1614;
  --ok: #55C985; --ok-soft: #142D1E; --warn: #F2AE48; --warn-soft: #33240C;
  --bar: #000000; --bar-ink: #FFFFFF; --bar-muted: #8A8A8E; --bar-2: #1C1C1C; --shade: rgba(0,0,0,.6); --frame: #050505; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #1A1A1A; --surface-2: #222222; --ink: #F1F1F1; --muted: #9D9DA1; --line: #2D2D2E;
  --red: #F0453B; --red-ink: #FF7A71; --red-soft: #3A1614;
  --ok: #55C985; --ok-soft: #142D1E; --warn: #F2AE48; --warn-soft: #33240C;
  --bar: #000000; --bar-ink: #FFFFFF; --bar-muted: #8A8A8E; --bar-2: #1C1C1C; --shade: rgba(0,0,0,.6); --frame: #050505; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--f-ar); font-size: 15px; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num { font-family: var(--f-ui); font-variant-numeric: tabular-nums; }

.app { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 0 0 1px var(--line); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; border-bottom: 3px solid var(--red); }
.top .logo { height: 26px; width: auto; display: block; }
.top .sp { flex: 1; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #333; background: var(--bar-2); color: var(--bar-ink); border-radius: 99px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; }
.pill-btn[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.role-tag { font-size: 11.5px; font-weight: 700; background: var(--bar-2); border: 1px solid #333; color: var(--bar-ink); border-radius: 99px; padding: 5px 10px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--bar-muted); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: #3BC46F; display: inline-block; }

.proto-note { margin: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-s); padding: 8px 10px; line-height: 1.6; }

.view { padding-block: 18px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; align-content: start; }
.block { display: grid; gap: 12px; min-width: 0; }
.view > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14.5px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; }
.eyebrow { font-family: var(--f-ui); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding-inline: 2px; }
.link { background: none; border: 0; color: var(--red-ink); font-weight: 600; font-size: 13px; padding: 0; }

.card { background: var(--surface); border-radius: var(--r-m); padding: 14px; border: 1px solid var(--line); display: grid; gap: 12px; }
.list { background: var(--surface); border-radius: var(--r-m); border: 1px solid var(--line); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; gap: 12px; align-items: center; padding: 14px; width: 100%; text-align: start; background: none; border: 0; }
.li .t { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .v { font-family: var(--f-ui); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }

.hello { background: var(--bar); color: var(--bar-ink); border-radius: var(--r-m); padding: 18px; display: grid; gap: 4px; }
.hello h1 { color: #fff; font-size: 20px; }
.hello .sub { color: var(--bar-muted); line-height: 1.7; }
.hello .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.hello .stat { background: var(--bar-2); border-radius: var(--r-s); padding: 12px 10px; display: grid; gap: 2px; }
.hello .stat b { font-family: var(--f-ui); font-size: 19px; font-variant-numeric: tabular-nums; }
.hello .stat span { font-size: 11.5px; color: var(--bar-muted); }

.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; gap: 12px; align-items: center; text-align: start; min-width: 0; }
.qa .ic { width: 38px; height: 38px; border-radius: var(--r-s); display: grid; place-items: center; background: var(--red-soft); color: var(--red-ink); flex: none; }
.qa b { display: block; font-size: 14px; }
.qa span.d { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }

.attn { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: none; border: 0; width: 100%; text-align: start; }
.attn .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; }
.dot.bad { background: var(--red); } .dot.warn { background: var(--warn); } .dot.info { background: var(--muted); } .dot.ok { background: var(--ok); }
.attn .act { align-self: center; flex: none; font-size: 12px; font-weight: 700; color: var(--red-ink); background: var(--red-soft); border-radius: 99px; padding: 6px 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .c { font-family: var(--f-ui); font-size: 11.5px; opacity: .7; margin-inline-start: 4px; }

.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--red-soft); color: var(--red-ink); }
.tag.dark { background: var(--ink); color: var(--surface); }

.stagebar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
.stagebar i { height: 4px; border-radius: 3px; background: var(--line); }
.stagebar i.on { background: var(--red); }
.stagebar.done i { background: var(--ok); }
.stagebar.cancel i { background: var(--line); }

.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats4 div { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 8px; display: grid; gap: 2px; text-align: center; }
.stats4 b { font-family: var(--f-ui); font-size: 18px; font-variant-numeric: tabular-nums; }
.stats4 span { font-size: 11px; color: var(--muted); }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; font-size: 15px; min-width: 0; }
.input.num { text-align: left; direction: ltr; }
textarea.input { resize: vertical; line-height: 1.7; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 8px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.picker { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 15px; flex: none; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.line { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; display: grid; gap: 10px; }
.line-head { display: flex; gap: 8px; align-items: flex-start; }
.line-head .n { font-family: var(--f-ui); font-weight: 800; color: var(--red); font-size: 13px; padding-top: 2px; }
.line-head .name { flex: 1; min-width: 0; font-weight: 600; line-height: 1.45; }
.line-head .meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.icon-btn { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--muted); flex: none; }
.line-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.line-grid .field > label { font-size: 11.5px; }
.static { padding: 10px 0; font-weight: 600; font-size: 14px; }
.line-total { font-family: var(--f-ui); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; padding: 9px 0; text-align: end; }
.more { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.more .wide { grid-column: 1 / -1; }
.internal { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.internal b { font-family: var(--f-ui); color: var(--ink); font-variant-numeric: tabular-nums; }
.add-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.add-btn { border: 1.5px dashed var(--line); background: none; border-radius: var(--r-m); padding: 12px 6px; font-weight: 700; font-size: 13px; color: var(--red-ink); display: grid; gap: 6px; justify-items: center; }

.totals { background: var(--bar); color: var(--bar-ink); border-radius: var(--r-m); padding: 16px; display: grid; gap: 8px; }
.totals .tr { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: #D6D6D8; }
.totals .tr b { font-family: var(--f-ui); font-variant-numeric: tabular-nums; color: #fff; font-weight: 700; }
.totals .grand { border-top: 1px solid #333; padding-top: 10px; margin-top: 2px; font-size: 15px; color: #fff; font-weight: 700; align-items: center; }
.totals .grand b { font-size: 24px; }
.totals .dep { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.totals .dep div { background: var(--bar-2); border-radius: var(--r-s); padding: 8px 10px; font-size: 12px; color: var(--bar-muted); }
.totals .dep b { display: block; font-size: 16px; color: #fff; }
.totals .intl { border-top: 1px dashed #3a3a3a; padding-top: 10px; display: grid; gap: 6px; }
.totals .intl .tr { font-size: 13px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: var(--r-s); }
.check.ok { background: var(--ok-soft); color: var(--ok); } .check.warn { background: var(--warn-soft); color: var(--warn); } .check.bad { background: var(--red-soft); color: var(--red-ink); } .check.info { background: var(--surface-2); color: var(--muted); }

.btn { border: 0; border-radius: var(--r-s); padding: 13px 16px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.primary { background: var(--red); color: #fff; }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.btn.small { padding: 9px 12px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* calculator */
.calc-out { background: var(--bar); color: var(--bar-ink); border-radius: var(--r-m); padding: 14px; display: grid; gap: 12px; }
.calc-out .big { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.calc-out .big b { font-family: var(--f-ui); font-size: 28px; font-variant-numeric: tabular-nums; }
.calc-out .big span { color: var(--bar-muted); font-size: 13px; }
.calc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.calc-grid div { background: var(--bar-2); border-radius: var(--r-s); padding: 8px 10px; font-size: 11.5px; color: var(--bar-muted); display: grid; gap: 2px; }
.calc-grid b { font-family: var(--f-ui); font-size: 15px; color: #fff; font-variant-numeric: tabular-nums; }
.sheetviz { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.sheetviz svg { width: 96px; height: auto; display: block; }
.sheetviz .sv-sheet { fill: var(--surface-2); stroke: var(--muted); stroke-width: .25; }
.sheetviz .sv-piece { fill: var(--red-soft); stroke: var(--red); stroke-width: .2; }
.sheetviz p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
.sheetviz p b { color: var(--ink); font-family: var(--f-ui); }

/* nav */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(440px, 100%); z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding-top: 6px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] svg { color: var(--red); }
.nav .fab { width: 56px; height: 56px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 16px rgba(238,46,36,.35); border: 4px solid var(--surface); }
.nav .fab svg { color: #fff !important; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-end; background: var(--shade); }
.sheet { width: min(440px, 100%); max-height: 90%; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.full { max-height: 100%; height: 100%; border-radius: 0; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head h2 { flex: 1; }
.sheet-body { overflow-y: auto; padding-block: 2px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.sheet.full .sheet-head { background: var(--bar); color: var(--bar-ink); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.sheet.full .sheet-head .icon-btn { background: #262626; color: #fff; }
.sheet.full .sheet-body { padding-top: 16px; }
.sheet-foot { padding-block: 12px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; }

.steps { display: grid; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; inset-inline-start: 12px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-ui); font-size: 12px; font-weight: 800; background: var(--surface); border: 2px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.step.done .b { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.step.done::before { background: var(--ink); }
.step.now .b { background: var(--red); border-color: var(--red); color: #fff; }
.step .t { font-weight: 600; padding-top: 2px; }
.step .s { font-size: 12px; color: var(--muted); }
.step.todo .t { color: var(--muted); font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: end; font-weight: 600; min-width: 0; }

.versions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ver { border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: var(--surface-2); display: grid; }
.ver img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; max-width: 100%; }
.ver span { font-size: 11.5px; padding: 5px 7px; font-weight: 600; display: flex; justify-content: space-between; gap: 4px; }
.upload { border: 1.5px dashed var(--line); border-radius: var(--r-s); display: grid; place-items: center; aspect-ratio: 1; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; padding: 6px; cursor: pointer; position: relative; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.log { display: grid; gap: 10px; }

    padding-top: calc(86px + env(safe-area-inset-top, 0px)); padding-bottom: 16px; padding-right: env(safe-area-inset-right, 0px); padding-left: 0;

<script>
// Graficoo pricing engine — a line-by-line port of the Quote sheet formulas
// (Graficoo_Price_List_2027_Final1.xlsx → Quote!F:R and Quote!I40:I56).
function makeEngine(D) {
  const S = D.settings;
  const MARKETS = [
    { k: 'Samalut', ar: 'سمالوط', col: 'samalut' },
    { k: 'Minya & Gov.', ar: 'المنيا والمحافظات', col: 'minya' },
    { k: 'Cairo / Alex', ar: 'القاهرة / إسكندرية', col: 'cairo' },
    { k: 'International', ar: 'دولي', col: 'intl' },
  ];
  const byName = {};
  D.items.forEach((it) => { byName[it.name] = it; });
  const num = (x) => typeof x === 'number' && isFinite(x);
  const clean = (x) => Math.round(x * 1e6) / 1e6;
  const ceilTo = (x, s) => Math.ceil(clean(x / s)) * s;
  const floorTo = (x, s) => Math.floor(clean(x / s)) * s;
  const qtyFactor = (q) => {
    const f = S.qtyFactors;
    if (q == null) return 1;
    if (q < 0.5) return f[0];
    if (q < 1) return f[1];
    if (q < 3) return 1;
    if (q < 5) return f[2];
    return f[3];
  };
  const bandOf = (cost) => (num(cost) ? cost : 0) <= S.bands[0][0] ? 0 : (num(cost) ? cost : 0) <= S.bands[1][0] ? 1 : 2;

  // ---- Calculators sheet (Calculators!F5:F18 digital, F22:F29 custom supplier cost) ----
  const target = (c) => (c <= S.bands[0][0] ? S.bands[0][1] : c <= S.bands[1][0] ? S.bands[1][1] : S.bands[2][1]);
  const floorM = (c) => (c <= S.bands[0][0] ? S.bands[0][2] : c <= S.bands[1][0] ? S.bands[1][2] : S.bands[2][2]);
  const mult = (market, i) => { const m = S.markets.find((x) => x[0] === market) || S.markets[0]; return m[i]; };
  const roundStep = (x) => (x <= 500 ? S.round500 : x <= 2000 ? S.round2000 : S.roundAbove);
  function priceFromCost(cost, market, designHours, ctype) {
    const design = (designHours || 0) * S.designRate * mult(market, 1);
    let price, min;
    if (ctype === 'Office') {
      price = ceilTo(Math.max(cost + S.officeAdd, cost / (1 - S.officeMinMargin)) + design, 10);
      min = ceilTo(cost / (1 - S.officeMinMargin), 5);
    } else {
      const b0 = S.bands[0][0], b1 = S.bands[1][0];
      const base = Math.max(Math.max(cost / (1 - target(cost)), cost > b0 ? b0 / (1 - S.bands[0][1]) : 0, cost > b1 ? b1 / (1 - S.bands[1][1]) : 0), cost + S.minProfit);
      const raw = base * mult(market, 2) + design;
      price = ceilTo(raw, roundStep(raw));
      min = ceilTo(Math.max(Math.max(cost / (1 - floorM(cost)), cost > b0 ? b0 / (1 - S.bands[0][2]) : 0, cost > b1 ? b1 / (1 - S.bands[1][2]) : 0), cost + S.minProfit), 5);
    }
    const margin = price ? (price - cost) / price : null;
    const lim = ctype === 'Office' ? S.officeMinMargin : floorM(cost);
    const status = margin < lim ? { lvl: 'bad', t: 'أقل من الحد الأدنى' } : margin < target(cost) ? { lvl: 'warn', t: 'مقبول — أقل من الهامش المستهدف' } : { lvl: 'ok', t: 'تمام' };
    return { design, price, min, margin, status, usd: market === 'International' ? ceilTo(price / S.usd, 0.5) : null };
  }
  function digital(o, market) {
    const G = S.digital;
    const w = +o.w, h = +o.h, qty = +o.qty;
    if (!(w > 0 && h > 0 && qty > 0)) return null;
    const perSheet = Math.max(Math.floor(G.w / w) * Math.floor(G.h / h), Math.floor(G.w / h) * Math.floor(G.h / w));
    if (!perSheet) return { perSheet: 0, error: 'المقاس أكبر من الفرخ (' + G.w + '×' + G.h + ')' };
    const sheets = Math.ceil(qty / perSheet);
    const paper = G.papers.find((p) => p[0] === o.paper) || G.papers[0];
    const sheetPrice = paper[o.sides === 2 ? 2 : 1];
    const paperCost = sheets * sheetPrice;
    const lam = o.lam ? sheets * G.lam : 0;
    const cut = sheets < G.freeCut ? 0 : sheets < 20 ? G.cut1 : G.cut2;
    const cost = paperCost + lam + cut + (+o.prep || 0);
    const p = priceFromCost(cost, market, +o.hours || 0, 'Regular');
    return { perSheet, sheets, sheetPrice, paperCost, lam, cut, prep: +o.prep || 0, cost, ...p, perPiece: p.price / qty };
  }
  function custom(o, market, ctype) {
    const sup = +o.supplier;
    if (!(sup > 0)) return null;
    const cost = sup + (+o.extra || 0);
    return { cost, ...priceFromCost(cost, market, +o.hours || 0, ctype === 'Office' ? 'Office' : 'Regular') };
  }

  // a line that came from a calculator or from repeating an old order: fixed price, known cost/min
  function fixedLine(l, ctype) {
    const price = num(l.override) ? l.override : l.price;
    const q = num(l.qty) ? l.qty : 1;
    const total = num(price) ? price : null;
    const cost = num(l.cost) ? l.cost : null;
    const profit = num(total) && num(cost) ? total - cost : null;
    const margin = num(profit) && total ? profit / total : null;
    let alert = { lvl: 'ok', t: 'تمام' };
    if (!num(total)) alert = { lvl: 'bad', t: 'اكتب السعر' };
    else if (num(l.min) && total < l.min - 0.01) alert = { lvl: 'bad', t: 'أقل من الحد الأدنى' };
    else if (l.kind === 'repeat' && !num(l.override)) alert = { lvl: 'warn', t: 'سعر آخر مرة — راجعه' };
    else if (num(margin) && num(cost) && margin < (ctype === 'Office' ? S.officeMinMargin : target(cost))) alert = { lvl: 'warn', t: 'هامش منخفض' };
    return { ok: true, fixed: true, it: { rule: l.kind === 'digital' ? 'Per-order' : 'Calc', unit: l.unit || '', cat: l.cat || '' }, q, extra: 0, extraBilled: 0, base: l.price, price: total, total, unitCost: cost, cost, profit, margin, min: num(l.min) ? l.min : null, maxCraft: null, alert };
  }

  function line(l, market, ctype) {
    if (l.fixed && l.calc) {
      // calculator lines re-price with the quote's market, like Excel's calculator market cell
      const r = l.calc.tab === 'digital' ? digital(l.calc, market) : custom(l.calc, market, ctype);
      if (r && !r.error) return fixedLine({ ...l, price: r.price, cost: r.cost, min: r.min }, ctype);
    }
    if (l.fixed) return fixedLine(l, ctype);
    const it = byName[l.item];
    if (!it) return { ok: false, alert: { lvl: 'bad', t: 'الصنف مش موجود' } };
    const q = num(l.qty) ? l.qty : null;
    const extra = num(l.extra) ? l.extra : 0;
    const mcol = (MARKETS.find((m) => m.k === market) || MARKETS[0]).col;
    const R = ctype === 'Office' && num(it.office) ? it.office : it[mcol];
    let G = null;
    if (num(R)) {
      G = it.rule === 'Per-order' && ctype !== 'Office'
        ? Math.max(ceilTo(R * qtyFactor(q), 10), num(it.floor) ? it.floor : 0)
        : R;
    }
    const price = num(l.override) ? l.override : G;
    const extraBilled = extra > 0 ? ceilTo(extra / (1 - S.bands[0][1]), 10) : 0;
    const I = q == null || !num(price) ? null : q * price + extraBilled;
    const craft = num(l.craft) ? l.craft : num(it.install) ? it.install : null;
    const O = it.rule === 'Package' ? (num(craft) ? it.mat + craft : null) : num(it.eff) ? it.eff : null;
    const J = q != null && num(O) ? q * O + extra : null;
    const K = num(I) && num(J) ? I - J : null;
    const L = num(K) && I !== 0 ? K / I : null;
    let Q = null;
    if (q != null) {
      if (ctype === 'Office') Q = num(O) ? (q * O + extra) / (1 - S.officeMinMargin) : null;
      else Q = num(it.floor) ? q * it.floor + extra / (1 - S.bands[0][2]) : null;
    }
    const maxCraft = it.rule === 'Package' && num(price) ? price * (1 - S.bands[0][1]) - it.mat : null;
    const b = bandOf(O);
    let alert = { lvl: 'ok', t: 'تمام' };
    if (it.rule === 'Pass-through' && num(price) && num(I)) alert = { lvl: 'ok', t: 'تمام' };
    else if (!num(price)) alert = { lvl: 'bad', t: 'مش متاح في السوق ده' };
    else if (!num(I)) alert = null;
    else if (num(Q) && I < Q - 0.01) alert = { lvl: 'bad', t: 'أقل من الحد الأدنى' };
    else if (it.rule === 'Package' && !num(O)) alert = { lvl: 'warn', t: 'اكتب تكلفة الصنايعي' };
    else if (it.rule === 'Package' && num(L) && L < S.bands[b][2]) alert = { lvl: 'bad', t: 'تكلفة الصنايعي عالية' };
    else if (num(L) && L < (ctype === 'Office' ? S.officeMinMargin : S.bands[b][1])) alert = { lvl: 'warn', t: 'هامش منخفض' };
    return { ok: true, it, q, extra, extraBilled, base: G, price, total: I, unitCost: O, cost: J, profit: K, margin: L, min: Q, maxCraft, alert };
  }

  function quote(d) {
    const rows = d.lines.map((l) => line(l, d.market, d.ctype));
    const sum = (f) => rows.reduce((a, r) => a + (num(r[f]) ? r[f] : 0), 0);
    const sub = sum('total');
    const tier = S.tiers[d.ctype] || 0;
    const extraPct = num(d.extraPct) ? d.extraPct : 0;
    const disc = floorTo(sub * (tier + extraPct), 5);
    const total = sub - disc;
    const deposit = ceilTo(total * S.deposit, 10);
    const intl = d.market === 'International';
    const usd = intl ? ceilTo(total / S.usd, 0.5) : null;
    const cost = sum('cost');
    const fee = intl ? ceilTo(total * S.intlFee, 1) : 0;
    const profit = sub - disc - cost - fee;
    const margin = total > 0 ? profit / total : null;
    const floorSum = rows.reduce((a, r) => a + (num(r.min) ? r.min : num(r.total) ? r.total : 0), 0);
    const lowest = Math.max(floorSum, cost + S.minProfit);
    const room = Math.max(0, sub - lowest);
    const maxDisc = sub ? room / sub : null;
    let check = null;
    if (sub > 0) {
      if (total < lowest - 0.01) check = { lvl: 'bad', t: 'الخصم نزّل السعر تحت أقل سعر. أقصى خصم ' + Math.round((maxDisc || 0) * 100) + '%' };
      else if (profit < S.minProfit) check = { lvl: 'bad', t: 'ربح الأوردر أقل من الحد الأدنى (' + S.minProfit + ' جنيه)' };
      else if (intl && total / S.usd < 50) check = { lvl: 'warn', t: 'أقل من الحد الأدنى للأوردر الدولي (50 دولار)' };
      else check = { lvl: 'ok', t: 'السعر سليم' };
    }
    const rules = rows.filter((r) => r.ok).map((r) => r.it.rule);
    const design = sub > 0 && rules.some((x) => x === 'Per-order' || x === 'Wide' || x === 'Add-on') && !rules.includes('Service')
      ? 'مفيش بند تصميم في الأوردر. لو الملف جاهز من العميل تجاهل التنبيه.' : null;
    return { rows, sub, tier, disc, total, deposit, balance: total - deposit, usd, cost, fee, profit, margin, lowest, room, maxDisc, check, design };
  }

  return { MARKETS, byName, line, quote, digital, custom, priceFromCost, num, ceilTo, floorTo };
}
if (typeof module !== 'undefined') module.exports = { makeEngine };

</script>

/* ---------- server ----------
   Two ways to reach the same Apps Script backend:
   - installable app (GitHub Pages): plain HTTPS calls to the web-app URL, no Google sign-in involved
   - page served by Apps Script itself: google.script.run */
const API_URL = "https://script.google.com/macros/s/AKfycbxrs5FcX0rcJtJ7oYJWWHvVgvotD7D0tWpgfupsyZE0CssG_mcisxRU6rKK1SojXpc0aQ/exec";
const USE_FETCH = /^https:\/\//.test(API_URL);
function rpc(fn, args) {
  if (USE_FETCH) {
    return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow', credentials: 'omit' })
      .catch(() => { throw new Error('مفيش اتصال بالنت، جرّب تاني'); })
      .then((r) => r.json())
      .then((j) => { if (!j || !j.ok) throw new Error((j && j.error) || 'حصلت مشكلة في السيرفر'); return j.data; });
  }
  return new Promise((resolve, reject) => { google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => reject(new Error((err && err.message) || String(err))))[fn](...args); });
}
function api(fn, ...args) {
  return rpc(fn, [store.get('token'), ...args]).catch((err) => {
    if (/AUTH/.test(err.message)) { logoutLocal(); throw new Error('الجلسة خلصت، ادخل تاني'); }
    throw err;
  });
}
let busyN = 0;
function busy(on, msg) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  let b = document.getElementById('busy');
  if (busyN && !b) { b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; document.body.appendChild(b); }
  if (b) { if (busyN) b.innerHTML = `<div><span class="spin"></span><span>${esc(msg || 'لحظة...')}</span></div>`; else b.remove(); }
}
async function withBusy(msg, fn) {
  busy(true, msg);
  try { return await fn(); } catch (e) { toast(e.message || 'حصلت مشكلة، جرّب تاني'); throw e; } finally { busy(false); }
}
function toServer(p) {
  const o = { ...p };
  delete o.snap; delete o._local;
  o.quick = p.quick ? 'yes' : '';
  return o;
}
async function saveP(p, opts) {
  const saved = await api('saveProject', toServer(p), opts || {});
  const i = state.projects.findIndex((x) => x.id === saved.id);
  if (i >= 0) state.projects[i] = saved; else state.projects.push(saved);
  return saved;
}

function followUps() { return state.projects.filter((p) => p.stage === '1 - Quotation' && p.sentAt && daysBetween(p.lastFollow || p.sentAt, TODAY) >= APP.followDays); }
function attention() {
  const out = [];
  if (!isStaff()) state.projects.filter((p) => p.needsApproval === 'pending').forEach((p) => out.push({ lvl: 'bad', t: `موافقة على سعر ${p.id}`, s: `${p.createdBy || 'موظف'} طالب يبعت ${money(p.quote)} لـ ${p.clientName}`, pid: p.id }));
  state.projects.forEach((p) => {
    if (isOpen(p) && p.delivery && p.delivery < TODAY && p.stage !== '1 - Quotation') out.push({ lvl: 'bad', t: `${p.id} متأخر عن ميعاد التسليم`, s: `${p.clientName} · كان المفروض ${shortDate(p.delivery)} · ${stageAr(p.stage)}`, pid: p.id });
    else if (isOpen(p) && p.delivery === TODAY && p.stage !== '1 - Quotation') out.push({ lvl: 'warn', t: `${p.id} تسليمه النهارده`, s: `${p.clientName} · ${p.desc}`, pid: p.id });
  });
  followUps().forEach((p) => out.push({ lvl: 'warn', t: `تابع مع ${p.clientName}`, s: `عرض ${p.quoteNo || p.id} اتبعت من ${daysBetween(p.sentAt, TODAY)} أيام ومفيش رد`, pid: p.id, act: 'follow' }));
  state.projects.filter((p) => p.stage === '7 - Delivered' && num(p.due) && p.due > 0).forEach((p) => out.push({ lvl: 'warn', t: `${money(p.due)} متبقي على ${p.clientName}`, s: `${p.id} اتسلم ومحتاج تحصيل · من Excel`, pid: p.id }));
  D.clients.filter((c) => c.tier === 'VIP' && c.activity === 'Dormant').slice(0, 2).forEach((c) => out.push({ lvl: 'info', t: `${c.name} بقاله فترة`, s: `${c.company || ''} · عميل VIP · كلّمه`, cid: c.id }));
  return out;
}
function morningLines() {
  const open = state.projects.filter((p) => isOpen(p) && p.stage !== '1 - Quotation');
  const today = open.filter((p) => p.delivery === TODAY).length;
  const late = open.filter((p) => p.delivery && p.delivery < TODAY).length;
  const fu = followUps().length;
  const dueSum = state.projects.filter((p) => p.stage === '7 - Delivered' && p.due > 0).reduce((a, p) => a + p.due, 0);
  const lines = [];
  if (today) lines.push(`${today} تسليم النهارده`);
  if (late) lines.push(`${late} مشروع متأخر`);
  if (fu) lines.push(`${fu} عرض محتاج متابعة`);
  if (dueSum) lines.push(`${fmt(dueSum)}ج متبقي على عملاء اتسلموا`);
  return lines;
}
function quoteStats() {
  const all = state.projects;
  const won = all.filter((p) => stageIdx(p.stage) >= 1).length;
  const lost = all.filter((p) => p.stage === 'Cancelled').length;
  const pending = all.filter((p) => p.stage === '1 - Quotation').length;
  return { sent: all.length, won, lost, pending, rate: won + lost ? won / (won + lost) : null };
}

  </div></section>
  ${d.quick ? '' : `<div class="field"><label for="qExtraPct">خصم إضافي يدوي %</label><input class="input num" id="qExtraPct" inputmode="decimal" value="${d.extraPct ? d.extraPct * 100 : ''}" placeholder="0"></div>`}
  </div><aside class="q-side">

function lineCard(l, i) {
  const r = E.line(l, state.draft.market, state.draft.ctype);
  const open = state.draft.open[i];
  if (l.fixed) {
    const src = { digital: 'حاسبة الديجيتال', custom: 'حاسبة الشغل الخاص', repeat: 'من أوردر قديم' }[l.kind];
    return `<div class="line" data-line="${i}">
      <div class="line-head"><span class="n">${String(i + 1).padStart(2, '0')}</span><div class="name">${esc(l.desc)}<div class="meta">${src}</div></div>
        ${l.calc ? `<button class="icon-btn" data-act="edit-calc" data-i="${i}" title="عدّل في الحاسبة">${ICON.edit}</button>` : ''}
        <button class="icon-btn" data-act="del-line" data-i="${i}" title="امسح">${ICON.trash}</button></div>
      <div class="line-grid">
        <div class="field"><span class="lbl" style="font-size:11.5px">الكمية</span><div class="static">${esc(l.qtyText || '—')}</div></div>
        <div class="field"><label for="p${i}" style="font-size:11.5px">سعر البند</label><input class="input num" id="p${i}" data-f="override" data-i="${i}" inputmode="decimal" value="${num(l.override) ? l.override : ''}" placeholder="${num(r.base) ? fmt(r.base) : '—'}"></div>
        <div class="line-total" data-out="total">${money(r.total)}</div>
      </div>
      <div class="internal" data-out="internal" hidden></div>
      <div data-out="alert"></div>
    </div>`;
  }
  const it = E.byName[l.item];
  const pkg = it && it.rule === 'Package';
  return `<div class="line" data-line="${i}">
    <div class="line-head"><span class="n">${String(i + 1).padStart(2, '0')}</span><div class="name">${esc(l.item)}<div class="meta">${esc(it ? it.cat : 'الصنف اتشال من القايمة')} · ${esc(it ? unitPhrase(it.unit) : '')}${l.note ? ' · ' + esc(l.note) : ''}</div></div>
      <button class="icon-btn" data-act="toggle-line" data-i="${i}" aria-expanded="${!!open}" title="تفاصيل">${ICON.chev(open)}</button>
      <button class="icon-btn" data-act="del-line" data-i="${i}" title="امسح">${ICON.trash}</button></div>
    <div class="line-grid">
      <div class="field"><label for="q${i}">الكمية ${it && it.unit === 'متر' ? '(م²)' : '(وحدة)'}</label><input class="input num" id="q${i}" data-f="qty" data-i="${i}" inputmode="decimal" value="${num(l.qty) ? l.qty : ''}"></div>
      <div class="field"><label for="p${i}">سعر الوحدة</label><input class="input num" id="p${i}" data-f="override" data-i="${i}" inputmode="decimal" value="${num(l.override) ? l.override : ''}" placeholder="${num(r.base) ? fmt(r.base) : '—'}"></div>
      <div class="line-total" data-out="total">${money(r.total)}</div>
    </div>
    ${open ? `<div class="more">
      <div class="field wide"><label for="n${i}">وصف يظهر للعميل (مقاس، تشطيب...)</label><input class="input" id="n${i}" data-f="note" data-i="${i}" value="${esc(l.note || '')}" placeholder="مثال: وجهين - مقاس 200×100"></div>
      <div class="field"><label for="x${i}">تكلفة إضافية (نقل، تجهيز)</label><input class="input num" id="x${i}" data-f="extra" data-i="${i}" inputmode="decimal" value="${num(l.extra) ? l.extra : ''}" placeholder="0"></div>
      ${pkg ? `<div class="field"><label for="c${i}">اتفاق الصنايعي / متر</label><input class="input num" id="c${i}" data-f="craft" data-i="${i}" inputmode="decimal" value="${num(l.craft) ? l.craft : ''}" placeholder="${num(it.install) ? it.install : 'اكتب الرقم'}"></div>` : ''}
    </div>` : ''}
    <div class="internal" data-out="internal" hidden></div>
    <div data-out="alert"></div>
  </div>`;
}

function quoteBlocked(q) { return isStaff() && ((q.check && q.check.lvl === 'bad') || q.rows.some((r) => r.alert && r.alert.lvl === 'bad')); }
function updateQuoteNumbers() {
  const d = state.draft;
  const q = E.quote(d);
  const inside = showInternal();
  q.rows.forEach((r, i) => {
    const el = document.querySelector(`.line[data-line="${i}"]`);
    if (!el) return;
    el.querySelector('[data-out="total"]').textContent = money(r.total);
    const pIn = el.querySelector('[data-f="override"]');
    if (pIn) pIn.placeholder = num(r.base) ? fmt(r.base) : '—';
    const inn = el.querySelector('[data-out="internal"]');
    inn.hidden = !inside;
    inn.innerHTML = `التكلفة <b>${money(r.cost)}</b> · الربح <b>${money(r.profit)}</b> · الهامش <b>${pct(r.margin)}</b>${num(r.min) ? ` · أقل سعر <b>${money(Math.ceil(r.min))}</b>` : ''}${num(r.maxCraft) ? ` · أقصى صنايعي <b>${money(Math.floor(r.maxCraft))}/م</b>` : ''}`;
    const a = el.querySelector('[data-out="alert"]');
    const al = r.alert;
    const show = al && (al.lvl === 'bad' || (inside && al.lvl !== 'ok') || (al.lvl === 'warn' && /صنايعي|راجعه/.test(al.t)));
    a.innerHTML = show ? `<span class="tag ${al.lvl}">⚠ ${esc(al.t)}</span>` : '';
  });
  const intl = d.market === 'International';
  $('#totals').innerHTML = `
    <div class="tr"><span>الإجمالي قبل الخصم</span><b>${money(q.sub)}</b></div>
    ${d.quick ? '' : `<div class="tr"><span>الخصم ${q.tier || d.extraPct ? `(${pct(q.tier + (d.extraPct || 0))})` : ''}</span><b>${q.disc ? '−' + money(q.disc) : '—'}</b></div>`}
    <div class="tr grand"><span>${d.quick ? 'المطلوب دلوقتي' : 'المطلوب من العميل'}</span><b>${money(q.total)}</b></div>
    ${intl ? `<div class="tr"><span>بالدولار</span><b>$${fmt(q.usd, 1)}</b></div>` : ''}
    ${d.quick ? '' : `<div class="dep"><div>المقدم ${pct(S.deposit)}<b class="num">${money(q.deposit)}</b></div><div>الباقي عند التسليم<b class="num">${money(q.balance)}</b></div></div>`}
    ${inside ? `<div class="intl">
      <div class="tr"><span>التكلفة</span><b>${money(q.cost)}</b></div>
      ${intl ? `<div class="tr"><span>عمولة التحويل</span><b>${money(q.fee)}</b></div>` : ''}
      <div class="tr"><span>صافي الربح</span><b>${money(q.profit)} · ${pct(q.margin)}</b></div>
      <div class="tr"><span>أقل إجمالي مقبول</span><b>${money(Math.ceil(q.lowest))}</b></div>
      <div class="tr"><span>مساحة التفاوض</span><b>${money(Math.floor(q.room))} · أقصى خصم ${pct(q.maxDisc)}</b></div>
    </div>` : ''}`;
  const checks = [];
  const blocked = quoteBlocked(q);
  if (blocked) checks.push(`<div class="check bad">⚠ السعر تحت الحد الأدنى. محتاج موافقة المالك قبل ما يتبعت.</div>`);
  else if (q.check && (q.check.lvl !== 'ok' || inside)) checks.push(`<div class="check ${q.check.lvl}">${q.check.lvl === 'ok' ? '✓' : '⚠'} ${esc(q.check.t)}</div>`);
  if (q.design && inside) checks.push(`<div class="check info">ℹ ${esc(q.design)}</div>`);
  $('#checks').innerHTML = checks.join('');
  const sb = $('#saveBtn');
  if (sb) { sb.textContent = blocked ? 'اطلب موافقة المالك' : 'احفظ وابعت'; sb.dataset.act = blocked ? 'ask-approval' : 'save-quote'; }
  saveDraftLocal();
}

/* ---------- sheets ---------- */
function openSheet(html, full) { $('#layer').innerHTML = `<div class="sheet-wrap" data-act="close-bg"><div class="sheet ${full ? 'full' : ''}" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $('#layer').innerHTML = ''; }
const closeBtn = `<button class="icon-btn" data-act="close" aria-label="إغلاق">${ICON.close}</button>`;

let itemCat = 'الكل', itemQ = '';
function itemSheet() {
  const cats = ['الكل', ...new Set(D.items.map((i) => i.cat))];
  openSheet(`<div class="sheet-head"><h2>قايمة الأسعار</h2>${closeBtn}</div>
  <div class="sheet-body">
    <div class="block"><input class="input" id="itemSearch" type="search" placeholder="دوّر: بانر، كارت، ختم..." value="${esc(itemQ)}" autocomplete="off">
    <div class="chips">${cats.map((c) => `<button class="chip" data-icat="${esc(c)}" aria-pressed="${c === itemCat}">${esc(c)}</button>`).join('')}</div></div>

function fillItems() {
  const m = E.MARKETS.find((x) => x.k === state.draft.market);

  $('#itemList').innerHTML = list.map((i) => {
    const p = state.draft.ctype === 'Office' && num(i.office) ? i.office : i[m.col];
    return `<button class="li" data-item="${esc(i.name)}"><span class="grow"><div class="t" style="white-space:normal">${esc(i.name)}</div><div class="s">${esc(i.cat)} · ${esc(unitPhrase(i.unit))}${showInternal() && num(i.eff) ? ` · تكلفة ${money(i.eff)}` : ''}</div></span><span class="v">${num(p) ? money(p) : '<span class="tag">غير متاح</span>'}</span></button>`;
  }).join('') || '<div class="li"><span class="sub">مفيش صنف بالاسم ده.</span></div>';

function packageSheet() {

/* calculators */
let calc = null;

    </div>
    <div id="calcOut"></div>` : `
    <p class="sub" style="margin:0;line-height:1.7">لأي شغل مش في القايمة (أوفست خاص، فلايرات، علب...): اكتب تكلفة المطبعة، والسعر بيطلع بنفس هوامش الشيت.</p>

      <div class="field"><label for="cqty">الكمية (نص)</label><input class="input" id="cqty" data-c="cqty" value="${esc(c.cqty)}" placeholder="مثال: 1000 فلاير"></div>

    </div>
    <div id="calcOut"></div>`;
  openSheet(`<div class="sheet-head"><h2>الحاسبة</h2>${closeBtn}</div>

function sheetSVG(c) {
  const G = S.digital;
  const w = +c.w, h = +c.h;
  const a = Math.floor(G.w / w) * Math.floor(G.h / h), b = Math.floor(G.w / h) * Math.floor(G.h / w);
  const [pw, ph] = a >= b ? [w, h] : [h, w];
  const cols = Math.floor(G.w / pw), rows = Math.floor(G.h / ph);
  let rects = '';
  if (cols * rows <= 600) for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) rects += `<rect class="sv-piece" x="${x * pw}" y="${y * ph}" width="${pw}" height="${ph}"/>`;
  return `<svg viewBox="-0.5 -0.5 ${G.w + 1} ${G.h + 1}" role="img" aria-label="ترتيب القطع على الفرخ"><rect class="sv-sheet" x="0" y="0" width="${G.w}" height="${G.h}"/>${rects}</svg>`;
}
function updateCalc() {
  const c = calc, out = $('#calcOut');
  if (!out) return;
  const inside = showInternal();
  const market = c.market;
  let r;
  if (c.tab === 'digital') {
    r = E.digital({ w: c.w, h: c.h, qty: c.qty, paper: c.paper, sides: c.sides, lam: c.lam, prep: c.prep, hours: c.hours }, market);
    if (!r) { out.innerHTML = '<div class="check info">اكتب المقاس والكمية.</div>'; return setAdd(false); }
    if (r.error) { out.innerHTML = `<div class="check bad">⚠ ${r.error}</div>`; return setAdd(false); }
    out.innerHTML = `
      <div class="card"><div class="sheetviz">${sheetSVG(c)}<p><b>${r.perSheet}</b> قطعة في الفرخ (${S.digital.w}×${S.digital.h})<br><b>${fmt(r.sheets)}</b> فرخ للكمية دي<br>${r.cut ? `قص: <b>${r.cut}ج</b>` : 'من غير رسوم قص'}${r.lam ? ` · سلفنة <b>${fmt(r.lam, 1)}ج</b>` : ''}</p></div></div>
      <div class="calc-out">
        <div class="big"><span>السعر للكمية</span><b>${money(r.price)}</b></div>
        <div class="calc-grid">
          <div>سعر القطعة<b>${fmt(r.perPiece, 2)}ج</b></div>
          ${inside ? `<div>التكلفة<b>${fmt(r.cost, 1)}ج</b></div><div>أقل سعر<b>${money(r.min)}</b></div><div>الهامش<b>${pct(r.margin)}</b></div><div>الورق<b>${fmt(r.paperCost, 1)}ج</b></div>` : ''}
          ${r.design ? `<div>تصميم<b>${money(r.design)}</b></div>` : ''}
          ${r.usd ? `<div>بالدولار<b>$${fmt(r.usd, 1)}</b></div>` : ''}
        </div>
      </div>
      ${inside && r.status.lvl !== 'ok' ? `<div class="check ${r.status.lvl}">⚠ ${r.status.t}</div>` : ''}`;
    return setAdd(true);
  }
  r = E.custom({ supplier: c.supplier, extra: c.extra, hours: c.chours }, market, c.standalone ? 'Regular' : state.draft.ctype);
  if (!r) { out.innerHTML = '<div class="check info">اكتب تكلفة المطبعة.</div>'; return setAdd(false); }
  out.innerHTML = `<div class="calc-out">
      <div class="big"><span>السعر للعميل</span><b>${money(r.price)}</b></div>
      ${inside ? `<div class="calc-grid"><div>التكلفة<b>${money(r.cost)}</b></div><div>أقل سعر<b>${money(r.min)}</b></div><div>الهامش<b>${pct(r.margin)}</b></div>${r.design ? `<div>تصميم<b>${money(r.design)}</b></div>` : ''}${r.usd ? `<div>بالدولار<b>$${fmt(r.usd, 1)}</b></div>` : ''}</div>` : ''}
    </div>

  setAdd(!!String(c.cdesc).trim());
}

function linesFromSnap(snap, lang) {
  const q = E.quote(snap);
  const usd = snap.market === 'International' && lang === 'en';
  const conv = (v) => (usd ? Math.round((v / S.usd) * 100) / 100 : v);
  const cur = (v) => (num(v) ? (usd ? '$' + fmt(conv(v), 2) : lang === 'en' ? 'EGP ' + fmt(v) : fmt(v) + 'ج') : '—');
  const lines = q.rows.map((r, i) => {
    const l = snap.lines[i];
    if (l.fixed) return { desc: lang === 'en' ? (l.descEn || l.desc) : l.desc, qty: lang === 'en' ? (l.qtyEn || l.qtyText) : l.qtyText, price: cur(r.price), total: conv(r.total), job: l.job || '', item: l.desc };
    const it = r.it || {};
    const desc = lang === 'en' ? (it.en || l.item) + (l.note ? ' - ' + l.note : '') : l.item + (l.note ? ' - ' + l.note : '');
    const pr = num(r.price) ? (lang === 'en' ? cur(r.price) + ' ' + unitEn(it.unit) : fmt(r.price) + 'ج ' + unitPhrase(it.unit)) + (r.extraBilled ? ' + ' + cur(r.extraBilled) : '') : '—';
    return { desc, qty: r.ok ? (lang === 'en' ? qtyTextEn(r.q, it.unit) : qtyText(r.q, it.unit)) : '—', price: pr, total: conv(r.total), job: l.note || '', item: l.item };
  });
  const sub = lines.reduce((a, l) => a + (num(l.total) ? l.total : 0), 0);
  const disc = conv(q.disc);
  return { lines, sub, disc, total: Math.round((sub - disc) * 100) / 100, cur: usd ? 'USD' : 'EGP' };
}
function docFromDraft(type, lang) {

}

/* PDF: render the paper at A4 width, snapshot it, save to Drive */
let libsP = null;
function loadLibs() {
  if (libsP) return libsP;
  const add = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('مش قادر يحمّل أداة الـ PDF، اتأكد من النت')); document.head.appendChild(s); });
  libsP = Promise.all([add(CDN.h2c), add(CDN.pdf)]).catch((e) => { libsP = null; throw e; });
  return libsP;
}
async function makePdf(doc) {
  await loadLibs();
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const stage = $('#pdfStage');
  stage.innerHTML = paperHTML(doc);
  const el = stage.querySelector('.paper');
  await Promise.all([...el.querySelectorAll('img')].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
  stage.innerHTML = '';
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait', compress: true });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  const ratio = canvas.height / canvas.width;
  let w = W, h = W * ratio;
  if (h > H) { h = H; w = H / ratio; }
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (W - w) / 2, 0, w, h);
  return pdf.output('datauristring').split(',')[1];
}

/* image resize before upload (keeps Drive light) */
function resizeImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('مش قادر يقرا الصورة'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('الملف مش صورة'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.86));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  go('quote');
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-nav],[data-go],[data-act],[data-proj],[data-client],[data-pf],[data-market],[data-ctype],[data-item],[data-icat],[data-pickclient],[data-pkg],[data-ctab],[data-paper],[data-sides],[data-lam],[data-cmarket],[data-lang],[data-sup]');
  if (!t || !D) return;
  const ds = t.dataset;
  if (ds.act === 'close-bg') { if (e.target === t) closeSheet(); return; }
  if (ds.nav) { if (ds.nav === 'quote' && state.draft.quick) state.draft = newDraft(null); return go(ds.nav); }
  if (ds.go === 'quote-new') { if (state.draft.quick) state.draft = newDraft(null); return go('quote'); }
  if (ds.go === 'quick-sale') { state.draft = newDraft(clientById('C-001'), true); return go('quote'); }
  if (ds.go === 'calc') { calc = defaultCalc(true); return calcSheet(true); }
  if (ds.go === 'invoice-pick') return invoicePickSheet();
  if (ds.go) return go(ds.go);
  if (ds.pf) { state.projFilter = ds.pf; return render(); }
  if (ds.market) { state.draft.market = ds.market; return render(); }
  if (ds.ctype) { state.draft.ctype = ds.ctype; return render(); }
  if (ds.icat) { itemCat = ds.icat; document.querySelectorAll('[data-icat]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.icat === itemCat)); return fillItems(); }
  if (ds.item) {
    state.draft.lines.push({ item: ds.item, qty: 1 });
    state.draft.open[state.draft.lines.length - 1] = E.byName[ds.item].rule === 'Package';
    closeSheet(); render(); toast('اتضاف: ' + ds.item); return;
  }
  if (ds.pkg) {
    const k = D.packages[+ds.pkg];
    k.lines.filter((x) => E.byName[x[0]]).forEach((x) => { state.draft.lines.push({ item: x[0], qty: x[1] }); if (E.byName[x[0]].rule === 'Package') state.draft.open[state.draft.lines.length - 1] = true; });
    if (!state.draft.desc) state.draft.desc = 'باقة ' + k.name;
    closeSheet(); render(); toast(`اتضافت باقة «${k.name}».`); return;
  }
  if (ds.ctab) { calc.tab = ds.ctab; return calcSheet(calc.standalone); }
  if (ds.cmarket) { calc.market = ds.cmarket; document.querySelectorAll('[data-cmarket]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.cmarket === calc.market)); return updateCalc(); }
  if (ds.paper) { calc.paper = ds.paper; document.querySelectorAll('[data-paper]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.paper === calc.paper)); return updateCalc(); }
  if (ds.sides) { calc.sides = +ds.sides; document.querySelectorAll('[data-sides]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.sides === calc.sides)); return updateCalc(); }
  if (ds.lam) { calc.lam = ds.lam === '1'; document.querySelectorAll('[data-lam]').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.lam === '1') === calc.lam)); return updateCalc(); }
  if (ds.lang) { docState.lang = ds.lang; return openDoc(docState); }
  if (ds.sup) return jobSheet(ds.id, ds.sup);
  if (ds.pickclient) {
    const c = clientById(ds.pickclient);
    state.draft.client = c; state.draft.market = CITY_MARKET[c.city] || 'Samalut'; state.draft.ctype = c.tier === 'Loyal' ? 'Loyal' : 'Regular';
    closeSheet(); render(); return;
  }
  if (ds.proj && !ds.act) { if (ds.sub === 'follow') return followSheet(ds.proj); return projectSheet(ds.proj); }
  if (ds.client && !ds.act) return clientSheetView(ds.client);
  const P = () => state.projects.find((x) => x.id === ds.id);
  try {
    switch (ds.act) {
      case 'close': return closeSheet();
      case 'pick-item': return itemSheet();
      case 'pick-package': return packageSheet();
      case 'open-calc': calc = defaultCalc(false); return calcSheet(false);
      case 'edit-calc': calc = { ...state.draft.lines[+ds.i].calc, market: state.draft.market, editIndex: +ds.i }; return calcSheet(false);
      case 'calc-add': {
        const line = calcToLine();
        if (calc.editIndex != null) state.draft.lines[calc.editIndex] = line;
        else {
          if (calc.standalone) { state.draft = newDraft(null); state.draft.market = calc.market; }
          state.draft.lines.push(line);
          if (calc.standalone && !state.draft.desc) state.draft.desc = line.desc;
        }
        const wasEdit = calc.editIndex != null; calc = null;
        if (state.view !== 'quote') go('quote'); else { closeSheet(); render(); }
        return toast(wasEdit ? 'البند اتحدث.' : 'اتضاف للعرض.');
      }
      case 'pick-client': return clientSheet();
      case 'new-client': return newClientSheet(!!ds.pick || state.view === 'quote');
      case 'toggle-line': state.draft.open[ds.i] = !state.draft.open[ds.i]; return render();
      case 'del-line': state.draft.lines.splice(+ds.i, 1); state.draft.open = {}; return render();
      case 'reset-draft': state.draft = newDraft(null); return render();
      case 'to-normal': state.draft = Object.assign(newDraft(null), { lines: state.draft.lines }); return render();
      case 'quote-for': state.draft = newDraft(clientById(ds.id)); return go('quote');
      case 'preview-quote': return openDoc({ from: 'draft', type: 'quote', lang: enMode(state.draft.market) ? 'en' : 'ar' });
      case 'save-quote': return await saveQuote(false);
      case 'ask-approval': return await saveQuote(true);
      case 'save-quick': return await saveQuick();
      case 'advance': return await advance(ds.id);
      case 'repeat': return repeatOrder(ds.id, false);
      case 'edit-quote': return repeatOrder(ds.id, true);
      case 'approve-price': { await withBusy('بيسجّل الموافقة...', () => saveP({ ...P(), needsApproval: 'approved' }, { quoteNo: true, log: 'المالك وافق على السعر' })); projectSheet(ds.id); render(); return toast('اتوافق. الموظف يقدر يبعت العرض دلوقتي.'); }
      case 'follow': return followSheet(ds.id);
      case 'copy-follow': return copyText($('#followMsg').textContent);
      case 'copy': return copyText(ds.text);
      case 'sent-follow': { const p = P(); saveP({ ...p, lastFollow: TODAY }, { log: 'اتبعتت رسالة متابعة' }).then(() => render()).catch((er) => toast(er.message)); setTimeout(closeSheet, 400); return; }
      case 'send-design': {
        const p = P(); const v = p.versions[p.versions.length - 1]; const c = clientOfProject(p);
        const msg = `أهلاً يا ${firstName(p.clientName)}،\nده تصميم «${p.desc}» (نسخة ${p.versions.length}):\n${v.url}\nلو تمام ابعتلنا «موافق»، ولو محتاج تعديل قولّنا.`;
        window.open(waLink(c && c.mobile, msg), '_blank');
        await withBusy('بيسجّل...', () => saveP({ ...p, stage: p.stage === '3 - Design' ? '4 - Client Approval' : p.stage }, { log: `اتبعتت نسخة ${p.versions.length} من التصميم للعميل` }));
        projectSheet(p.id); return render();
      }
      case 'approve': { const p = P(); const v = p.versions.length; await withBusy('بيسجّل الموافقة...', () => saveP({ ...p, approval: { v, at: TODAY + ' ' + new Date().toTimeString().slice(0, 5) } }, { log: `العميل وافق على نسخة ${v} من التصميم` })); projectSheet(p.id); return toast('اتسجلت الموافقة. تقدر تنقله للطباعة.'); }
      case 'job': return jobSheet(ds.id);
      case 'send-doc': return await sendDoc();
      case 'cancel-proj': { await withBusy('بيلغي المشروع...', () => saveP({ ...P(), stage: 'Cancelled' }, { log: 'المشروع اتلغى' })); projectSheet(ds.id); render(); return toast(ds.id + ' اتلغى'); }
      case 'doc': return await openDoc({ from: 'project', type: ds.type, id: ds.id, lang: (P().snap && enMode(P().snap.market)) ? 'en' : 'ar' });
      case 'morning-preview': return morningSheet();
      case 'refresh': return await withBusy('بيحدّث...', () => refresh(false));
      case 'logout': api('logout').catch(() => {}); return logoutLocal();
    }
  } catch (err) { /* withBusy already showed the message */ }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (!t.dataset.upload) return;
  const f = t.files && t.files[0]; if (!f) return;
  const p = state.projects.find((x) => x.id === t.dataset.upload);
  try {
    await withBusy('بيرفع التصميم...', async () => {
      const dataUrl = await resizeImage(f);
      const n = (p.versions || []).length + 1;
      const up = await api('uploadFile', { kind: 'design', name: `${p.id} - نسخة ${n}.jpg`, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
      localThumbs[up.id] = dataUrl;
      await saveP({ ...p, versions: (p.versions || []).concat([{ id: up.id, url: up.url, at: TODAY }]) }, { log: `اترفعت نسخة ${n} من التصميم` });
    });
    projectSheet(p.id);
  } catch (er) { /* shown */ }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'newClientForm') return;
  e.preventDefault();
  const v = (id) => $('#' + id).value.trim();
  if (!v('ncName')) return toast('اكتب اسم العميل');
  const forPick = !!e.target.dataset.pick;
  try {
    const c = await withBusy('بيحفظ العميل...', () => api('saveClient', { name: v('ncName'), company: v('ncCo'), mobile: v('ncMob'), city: $('#ncCity').value, source: $('#ncSrc').value }));
    D.clients.push(c);
    if (forPick) { state.draft.client = c; state.draft.market = CITY_MARKET[c.city] || 'Samalut'; state.draft.ctype = 'Regular'; closeSheet(); if (state.view !== 'quote') go('quote'); else render(); }
    else { render(); clientSheetView(c.id); }
    toast(`اتسجل ${c.id}: ${c.name}`);
  } catch (er) { /* shown */ }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!D) return;
  if (t.id === 'clientSearch') { state.clientQ = t.value; const pos = t.selectionStart; render(); const n = $('#clientSearch'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'clientSearch2') { clientQ2 = t.value; return fillClients2(); }
  if (t.id === 'itemSearch') { itemQ = t.value; return fillItems(); }
  if (t.id === 'qDesc') { state.draft.desc = t.value; return saveDraftLocal(); }
  if (t.id === 'walkName') { state.draft.walkName = t.value; return saveDraftLocal(); }
  if (t.id === 'qExtraPct') { const v = parseFloat(t.value); state.draft.extraPct = isFinite(v) ? v / 100 : 0; return updateQuoteNumbers(); }
  if (t.dataset.c) {
    const k = t.dataset.c;
    calc[k] = ['cdesc', 'cqty'].includes(k) ? t.value : (t.value === '' ? '' : parseFloat(String(t.value).replace(/,/g, '')));
    return updateCalc();
  }
  if (t.dataset.f) {
    const l = state.draft.lines[+t.dataset.i];
    if (t.dataset.f === 'note') l.note = t.value;
    else { const v = parseFloat(String(t.value).replace(/,/g, '')); l[t.dataset.f] = isFinite(v) ? v : null; }
    updateQuoteNumbers();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });
$('#internalBtn').addEventListener('click', () => {
  state.internal = !state.internal;
  $('#internalBtn').setAttribute('aria-pressed', state.internal);
  $('#internalLbl').textContent = state.internal ? 'الوضع الداخلي' : 'وضع العميل';
  if (calc && $('#calcOut')) updateCalc(); else closeSheet();
  render();
});
$('#syncBtn').addEventListener('click', () => withBusy('بيحدّث...', () => refresh(false)).catch(() => {}));
boot();
// installable app: offline shell + updates (only when served over https as the installable version)
if (USE_FETCH && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
